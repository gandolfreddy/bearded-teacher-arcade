name: Test and deploy Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - games.json
      - assets/**
      - games/**
      - tools/**
      - tests/**
      - package.json
      - package-lock.json
      - .github/workflows/**
  pull_request:
    branches: [main]
    paths:
      - index.html
      - games.json
      - assets/**
      - games/**
      - tools/**
      - tests/**
      - package.json
      - package-lock.json
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Public + standard Linux runners: free compute. Private forks do not run.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Install one headless browser (no browser cache)
        run: npx playwright install --with-deps --only-shell chromium
      - name: Browser tests in an isolated session
        run: npm run test:browser:ci
        env:
          BTA_BROWSER: chromium
      - run: npm run build
      - name: Upload only deployable website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-production
      cancel-in-progress: false
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy tested artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
