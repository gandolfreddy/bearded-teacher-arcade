<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>直線賽車避障｜大鬍子老師遊戲廣場</title><link rel="stylesheet" href="./assets/game.css"><link rel="stylesheet" href="./assets/arcade.css"><link rel="stylesheet" href="./assets/race-pool.css"><script type="module" src="./assets/racer.mjs"></script></head>
<body data-phase="loading"><main class="game-main compact-game"><p class="kicker">KEEP YOUR LANE / 05</p><header class="game-header"><h1>直線賽車避障</h1><div class="stats"><span>距離 <output id="distance">0</output>/1000 m</span><span>時速 <output id="speed">80</output></span><span>閃避 <output id="passed">0</output></span><span>秒數 <output id="seconds">0</output></span></div></header><div class="controls"><button id="start" disabled>開始遊戲</button><button id="pause" class="secondary" disabled>暫停</button><button id="reset" class="secondary">重新開始</button></div><p id="status" class="status" role="status">正在準備遊戲…</p>
<div class="racer-wrap"><canvas id="board" class="racer-board" width="360" height="480" tabindex="0" role="img" aria-label="直線賽車，車道 2">需支援 Canvas。</canvas><progress id="distance-progress" max="1000" value="0" aria-label="抵達終點進度"></progress><span class="lane-caption">目前車道 <output id="lane">2</output> · 留意前方來車</span></div>
<div class="touch-actions racer-actions" aria-label="賽車觸控操作"><button data-action="left" aria-label="向左換道">←</button><button data-action="brake">減速 ↓</button><button data-action="right" aria-label="向右換道">→</button></div>
<p class="help">← →／A D 換道，按住空白鍵／↓／S 減速。碰到前車就結束，平安抵達 1000 公尺終點！</p><a class="standalone" href="../index.html">回到遊戲廣場</a><noscript><p>請啟用 JavaScript。</p></noscript></main></body></html>
