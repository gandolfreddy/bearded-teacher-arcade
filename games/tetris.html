<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>俄羅斯方塊｜大鬍子老師遊戲廣場</title><link rel="stylesheet" href="./assets/game.css"><link rel="stylesheet" href="./assets/arcade.css"><script type="module" src="./assets/tetris.mjs"></script></head>
<body data-phase="loading"><main class="game-main compact-game"><p class="kicker">STACK &amp; THINK / 03</p><header class="game-header"><h1>俄羅斯方塊</h1><div class="stats"><span>分數 <output id="score">0</output></span><span>消行 <output id="lines">0</output></span><span>等級 <output id="level">1</output></span><span>秒數 <output id="seconds">0</output></span></div></header><div class="controls"><button id="start" disabled>開始遊戲</button><button id="pause" class="secondary" disabled>暫停</button><button id="reset" class="secondary">重新開始</button></div><p id="status" class="status" role="status">正在準備遊戲…</p>
<div class="tetris-layout"><canvas id="board" class="tetris-board" width="240" height="480" tabindex="0" role="img" aria-label="俄羅斯方塊棋盤">需支援 Canvas。</canvas><aside class="tetris-previews"><section class="preview-box"><h2>HOLD <span>保留</span></h2><button id="hold-button" class="hold-picture" data-action="hold" aria-label="保留 C"><canvas id="hold-preview" width="96" height="64" role="img" aria-label="Hold：尚未保留"></canvas><output id="hold-name" class="piece-name">—</output></button><p id="hold-hint">每顆可保留一次</p></section><section class="preview-box"><h2>NEXT <span>接下來</span></h2><canvas id="next-preview" width="96" height="132" role="img" aria-label="Next 預覽"></canvas><output id="next-names" class="piece-name"></output></section></aside></div>
<div class="touch-actions tetris-actions" aria-label="方塊觸控操作"><button data-action="left" aria-label="向左">←</button><button data-action="down" aria-label="向下">↓</button><button data-action="right" aria-label="向右">→</button><button data-action="ccw" aria-label="逆時針旋轉">↶</button><button data-action="cw" aria-label="順時針旋轉">↷</button><button data-action="drop">落到底</button></div>
<p class="help">← → 移動、↓ 加速；↑／X 順轉、Z 逆轉；空白鍵落到底，C／Shift 保留。虛線為落點預覽。</p><a class="standalone" href="../index.html">回到遊戲廣場</a><noscript><p>請啟用 JavaScript。</p></noscript></main></body></html>
