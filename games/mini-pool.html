<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>迷你撞球｜大鬍子老師遊戲廣場</title><link rel="stylesheet" href="./assets/game.css"><link rel="stylesheet" href="./assets/arcade.css"><link rel="stylesheet" href="./assets/race-pool.css"><script type="module" src="./assets/pool.mjs"></script></head>
<body data-phase="loading"><main class="game-main compact-game"><p class="kicker">A LITTLE TABLE TIME / 06</p><header class="game-header"><h1>迷你撞球</h1><div class="stats"><span>已入 <output id="potted">0</output>/6</span><span>桿數 <output id="shots">0</output></span><span>犯規 <output id="fouls">0</output></span><span>秒數 <output id="seconds">0</output></span></div></header><div class="controls"><button id="start" disabled>開始遊戲</button><button id="pause" class="secondary" disabled>暫停</button><button id="reset" class="secondary">重新開始</button></div><p id="status" class="status" role="status">正在準備遊戲…</p>
<canvas id="board" class="pool-board" width="640" height="360" tabindex="0" role="img" aria-label="迷你撞球球桌">需支援 Canvas。</canvas>
<div class="pool-controls"><label>方向（度）<input id="aim-angle" type="number" min="0" max="359" step="1" value="0" disabled></label><label>力道 <output id="power-value">85</output>%<input id="power" type="range" min="10" max="100" step="5" value="85" disabled></label><button id="shoot" data-action="shoot" disabled>擊球</button></div>
<p class="help">從三角形球陣開球。觸控球桌或拖曳瞄準，選擇力道後按「擊球」。鍵盤 ← → 轉向、↑ ↓ 調力道、空白鍵／Enter 擊球。六顆色球全進袋就清台；白球落袋記一次犯規並回到空位。</p><a class="standalone" href="../index.html">回到遊戲廣場</a><noscript><p>請啟用 JavaScript。</p></noscript></main></body></html>
