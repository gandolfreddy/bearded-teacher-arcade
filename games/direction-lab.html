<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>方向操控練習｜操作示範</title><link rel="stylesheet" href="./assets/demo.css"><script type="module" src="./assets/demo.mjs"></script></head><body data-game-id="direction-lab" data-mode="direction"><main class="demo"><p class="label">PLAY LAB / 操作測試頁</p><h1>方向操控練習</h1><p class="description">這是網站骨架的操作示範。試試輸入，再返回大廳切換另一站。</p><div class="controls"><button id="start">開始練習</button><button id="pause" class="secondary" disabled>暫停</button></div><p id="status" class="status" role="status">準備好了，按「開始練習」。</p><div id="board" class="board" tabindex="0" aria-label="方向練習區，方向鍵或 WASD 操作"><span id="token" class="token" aria-hidden="true">✦</span></div><div class="dpad" aria-label="觸控方向鍵"><button data-action="up" aria-label="向上">↑</button><button data-action="left" aria-label="向左">←</button><button data-action="down" aria-label="向下">↓</button><button data-action="right" aria-label="向右">→</button></div><div class="metrics"><span>操作次數：<output id="count">0</output></span><span>練習秒數：<output id="seconds">0</output></span><span id="position"></span></div><p class="help">方向鍵／WASD 或畫面方向按鈕。離開視窗會暫停，需手動繼續。</p><a class="standalone" href="../index.html">回到遊戲廣場</a></main></body></html>
